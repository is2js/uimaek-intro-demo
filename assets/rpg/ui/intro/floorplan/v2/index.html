<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>평면도 놀이터 독립 예제</title><link rel="stylesheet" href="./playground.css">
<style>body{margin:0;background:#142221;color:#f4f1e8;font-family:system-ui}main{max-width:1200px;margin:40px auto;padding:16px}h1{font-size:24px}[data-floorplan-standalone]{min-height:240px}[data-fp-poster]{display:block;width:100%;height:auto;border-radius:16px}[data-fp-poster][hidden],[data-fp-mount][hidden],[data-fp-start][hidden]{display:none}[data-fp-start]{margin:16px 0;padding:12px 20px;border:1px solid #9ccbb8;border-radius:8px;background:#234334;color:#f4f1e8;font:inherit;cursor:pointer}[data-fp-start]:disabled{cursor:wait;opacity:.65}[data-fp-message]{min-height:1.5em;color:#b8cfbd}</style></head>
<body><main><h1>평면도 놀이터 · 독립 실행 예제</h1><p>가상 평면이며 실제 건물과 무관합니다.</p>
<section data-floorplan-standalone aria-label="실내 공간 체험">
